AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Import the existing SVP public hosted zone, active KSK, and DNSSEC unchanged.
  Record sets, registration, delegation, and parent DS remain external.
Resources:
  SiteHostedZone:
    Type: AWS::Route53::HostedZone
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Name: svpsouthruislip.org.uk.
      HostedZoneConfig:
        Comment: SVP's domain
      # This is the existing public zone; no VPC association or new delegation set.
  SiteKeySigningKey:
    Type: AWS::Route53::KeySigningKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      HostedZoneId:
        Ref: SiteHostedZone
      KeyManagementServiceArn: arn:aws:kms:us-east-1:995361647121:key/944105a2-c852-4c4f-a0f2-a0f1b91344c9
      Name: svpsouthruislip
      Status: ACTIVE
  SiteDnssec:
    Type: AWS::Route53::DNSSEC
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    DependsOn: SiteKeySigningKey
    Properties:
      HostedZoneId:
        Ref: SiteHostedZone
