AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Import the existing SVP DNSSEC KMS key and alias in us-east-1.
  Preserve signing material, policy, enabled state, and alias target.
Resources:
  DnssecKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: ''
      Enabled: true
      KeySpec: ECC_NIST_P256
      KeyUsage: SIGN_VERIFY
      MultiRegion: false
      Origin: AWS_KMS
      # Automatic rotation is not supported for this asymmetric signing key.
      # Retain means no deletion scheduling; do not set a new pending window.
      KeyPolicy:
        Version: '2012-10-17'
        Id: dnssec-policy
        Statement:
          - Sid: Enable IAM User Permissions
            Effect: Allow
            Principal:
              AWS: arn:aws:iam::995361647121:root
            Action: kms:*
            Resource: '*'
          - Sid: Allow Route 53 DNSSEC Service
            Effect: Allow
            Principal:
              Service: dnssec-route53.amazonaws.com
            Action:
              - kms:DescribeKey
              - kms:GetPublicKey
              - kms:Sign
            Resource: '*'
            Condition:
              StringEquals:
                aws:SourceAccount: '995361647121'
              ArnLike:
                aws:SourceArn: arn:aws:route53:::hostedzone/*
          - Sid: Allow Route 53 DNSSEC to CreateGrant
            Effect: Allow
            Principal:
              Service: dnssec-route53.amazonaws.com
            Action: kms:CreateGrant
            Resource: '*'
            Condition:
              Bool:
                kms:GrantIsForAWSResource: 'true'
  DnssecKeyAlias:
    Type: AWS::KMS::Alias
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      AliasName: alias/svpsouthruislipkey
      TargetKeyId:
        Ref: DnssecKey
