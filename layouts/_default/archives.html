{{ define "main" }}
<article class="article"><header class="article-header"><h1>{{ .Title }}</h1></header>{{ .Content }}
{{ range (where site.RegularPages "Section" "posts").GroupByDate "2006" }}<section class="archive-year"><h2>{{ .Key }}</h2><ol>{{ range .Pages }}<li><time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2 Jan" }}</time> <a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>{{ end }}</ol></section>{{ end }}</article>
{{ end }}
