<article class="post-card">
  <header><h2><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h2>{{ partial "post-meta.html" . }}</header>
  <div class="summary">{{ .Summary }}</div>
  {{ if .Truncated }}<p><a class="read-more" href="{{ .RelPermalink }}">Continue reading <span class="visually-hidden">{{ .LinkTitle }}</span> →</a></p>{{ end }}
</article>
